<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мой остров</title>
<style>
:root{--bg:#9ad4f5;--fg:#1a1a1a;--card:rgba(255,255,255,.93);--ac:#2e7d32;--btn:#e8f5e9;--off:#ddd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10243a;--fg:#f2f2f2;--card:rgba(24,30,42,.93);--ac:#66bb6a;--btn:#26402b;--off:#333}}
:root[data-theme="dark"]{--bg:#10243a;--fg:#f2f2f2;--card:rgba(24,30,42,.93);--ac:#66bb6a;--btn:#26402b;--off:#333}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

.pill{background:var(--card);border-radius:12px;padding:5px 10px;font-weight:700;font-size:15px}
.pill small{display:block;font-weight:400;font-size:11px;opacity:.7}
#ov{position:fixed;right:8px;top:calc(env(safe-area-inset-top,0px) + 62px);width:42px;height:42px;border:0;border-radius:12px;background:var(--card);font-size:20px}
#panel{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:16px 16px 0 0;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 10px);max-height:44vh;overflow-y:auto}
#tabs{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto}
.tab{flex:1 0 auto;white-space:nowrap;padding:8px 9px;border:0;border-radius:10px;background:var(--off);color:var(--fg);font-weight:600;font-size:13px}
.tab.on{background:var(--ac);color:#fff}
.b{display:block;width:100%;margin:5px 0;padding:11px;border:0;border-radius:10px;background:var(--btn);color:var(--fg);font-size:14px;font-weight:600;text-align:left}
.b:disabled{opacity:.45}
.row{display:flex;gap:6px}.row .b{flex:1}.row .b.sm{flex:0 0 38%;text-align:center}
.row.wrap{flex-wrap:wrap}.row.wrap .b.sm{flex:1 1 28%;padding:9px 4px}
.info{margin:4px 0;opacity:.85}
.lnk{margin:4px 0;padding:8px;border-radius:8px;background:var(--off);word-break:break-all;user-select:all;-webkit-user-select:all;font-size:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 150px);background:var(--card);padding:8px 14px;border-radius:12px;opacity:0;transition:opacity .3s;pointer-events:none;font-weight:600;max-width:90%;text-align:center}
#hint{position:fixed;left:0;right:0;top:112px;text-align:center;font-size:12px;opacity:.75;pointer-events:none}
</style></head><body>

const ZR={h:9,f:7.5,s:8,c:7,n:8},ZC={h:0x7fb069,f:0x9a7b4f,s:0x8d9299,c:0x555a60,n:0xb9bec4};

 const body=mesh(cyl(.45,.5,2.4,20),new THREE.MeshLambertMaterial({color:0xffffff}),0,1.4,0);rg.add(body);

 const win=mesh(new THREE.SphereGeometry(.17,12,10),0x4fc3f7,0,1.7,.42);win.scale.z=.5;rg.add(win);rg.add(mesh(new THREE.TorusGeometry(.19,.04,6,14),0x37474f,0,1.7,.43));
 for(let k=0;k<4;k++){const f=new THREE.Group();f.rotation.y=k*Math.PI/2;f.add(mesh(bx(.7,.9,.08),0x1565c0,.6,.65,0));rg.add(f)}
 rg.add(mesh(cyl(.25,.4,.4),0x263238,0,.2,0));
 const boost=(x,z)=>{const b=new THREE.Group();b.position.set(x,0,z);b.add(mesh(cyl(.18,.2,1.6,12),0xeceff1,0,1,0));b.add(mesh(new THREE.ConeGeometry(.18,.5,12),0xd32f2f,0,2.05,0));b.add(mesh(cyl(.1,.2,.25,10),0x263238,0,.15,0));return b};
 const b2=new THREE.Group();b2.add(boost(.75,0),boost(-.75,0));const b4=new THREE.Group();b4.add(boost(0,.75),boost(0,-.75));b2.visible=b4.visible=false;rg.add(b2,b4);
 for(let k=0;k<3;k++){const a=k*Math.PI*2/3+.5,l=mesh(cyl(.04,.05,.9,6),0x78909c,Math.cos(a)*.7,.0,Math.sin(a)*.7);l.rotation.z=Math.cos(a)*.4;l.rotation.x=-Math.sin(a)*.4;rg.add(l)}
 const fl=new THREE.Group();const f1=mesh(new THREE.ConeGeometry(.32,1.5,10),new THREE.MeshBasicMaterial({color:0xff9800}),0,-.55,0);f1.rotation.x=Math.PI;const f2=mesh(new THREE.ConeGeometry(.18,1,10),new THREE.MeshBasicMaterial({color:0xffee58}),0,-.35,0);f2.rotation.x=Math.PI;fl.add(f1,f2);fl.visible=false;rg.add(fl);
 return {g:rg,body,nose,b2,b4,fl}}
function mkTree(s=1){const t=new THREE.Group();t.add(mesh(cyl(.2,.28,1.4,6),0x6b4423,0,.7,0));t.add(mesh(new THREE.ConeGeometry(1.2,1.9,8),0x2e8b3a,0,2,0));t.add(mesh(new THREE.ConeGeometry(.9,1.5,8),0x3aa04a,0,3,0));t.scale.setScalar(s);return t}

 h.add(mesh(bx(1.9,.15,1.9),0x9e9e9e,0,.07,0));h.add(mesh(bx(1.8,1.3,1.8),wall,0,.8,0));
 const r=mesh(new THREE.ConeGeometry(1.5,1,4),rc,0,1.95,0);r.rotation.y=Math.PI/4;h.add(r);h.add(mesh(bx(.25,.6,.25),0x8d6e63,.5,2.1,.3));
 h.add(mesh(bx(.42,.8,.06),0x5d3a1a,0,.55,.92));h.add(mesh(new THREE.SphereGeometry(.04,6,6),0xffd54f,.14,.55,.97));h.add(mesh(bx(.9,.07,.5),0xbcaaa4,0,.04,1.2));
 [-.58,.58].forEach(x=>{h.add(mesh(bx(.46,.46,.04),0xffffff,x,1,.91));h.add(mesh(bx(.36,.36,.06),0x81d4fa,x,1,.92))});
 [-.91,.91].forEach(x=>{h.add(mesh(bx(.04,.46,.46),0xffffff,x,1,0));h.add(mesh(bx(.06,.36,.36),0x81d4fa,x,1,0))});return h}

 b.add(mesh(bx(1.1,1.4,.08),0xf2e6c9,0,.7,1.32));[.7,-.7].forEach(a=>{const x=mesh(bx(1.3,.08,.06),0xffffff,0,.7,1.37);x.rotation.z=a;b.add(x)});
 b.add(mesh(bx(.5,.5,.06),0xf2e6c9,0,2.25,1.32));[-1.6,1.6].forEach(x=>b.add(mesh(bx(.1,2,.1),0xffffff,x,1,1.3)));return b}

 f.add(mesh(cyl(.45,.6,4.5),0x555a60,.7,4.8,.7));f.add(mesh(cyl(.5,.5,.4),0xd32f2f,.7,6.5,.7));f.add(mesh(bx(1.2,.9,.08),new THREE.MeshBasicMaterial({color:0xff8f00}),0,1,1.43));f.add(mesh(bx(1.4,1.1,.06),0x212121,0,1,1.41));

 t.add(mesh(new THREE.LatheGeometry(pts,24),dbl(0xcfd3d6),0,0,0));t.add(mesh(cyl(2.35,2.35,.3,24),0xd32f2f,0,7.85,0));
 const rc=new THREE.Group();rc.position.z=5.2;rc.add(mesh(cyl(1.8,1.9,2.4,18),0xb0bec5,0,1.2,0));rc.add(mesh(new THREE.SphereGeometry(1.8,16,8,0,Math.PI*2,0,Math.PI/2),0x90a4ae,0,2.4,0));rc.add(mesh(bx(.8,.8,.05),0xffd600,0,1.3,1.88));t.add(rc);
 for(let k=0;k<3;k++){const m=mesh(new THREE.SphereGeometry(1.2,10,8),smokeMat(0xffffff),0,8.5,0);t.add(m);sm.push({m,o:k/3,y:8.5})}return t}
function mkPvo(){const t=new THREE.Group();t.add(mesh(cyl(1.3,1.5,.5,14),0x6b7077,0,.25,0));

function makeIsland(){
 const g=new THREE.Group();scene.add(g);const I={g,houses:[],rockets:[],panels:[],furn:[],towers:[],stables:[],smoke:[],pvo:{},slot:null};
 g.add(isle(31));g.add(mesh(bx(14,.2,14),0x888c94,18,.15,12));[[11.3,5.3],[24.7,5.3],[11.3,18.7],[24.7,18.7]].forEach(p=>g.add(mesh(bx(.9,.22,.9),0xffd600,p[0],.16,p[1])));
 [[28,22,1.1],[28,-18,1],[-28,-28,1.2],[26,-26,1],[-28,14,1],[-28,24,1.1],[8,27,1],[28,-5,.9],[-3,-27,1]].forEach(p=>{const t=mkTree(p[2]);t.position.set(p[0],0,p[1]);g.add(t)});

 Z.h.add(mesh(bx(15,.05,1.4),0x616161,0,.16,0));for(let i=-3;i<=3;i++)Z.h.add(mesh(bx(1,.06,.12),0xffffff,i*2,.17,0));

 const av=mkHuman(new THREE.Color().setHSL(p.c||0,.7,.5));I.g.add(av.g);const r={I,av,tx:0,tz:0,name:p.name||'Игрок',st:null};remotes.set(p.id,r);applyState(r,p.d);I.shieldUntil=Date.now()+(p.sh||0)}
function dropRemote(id){const r=remotes.get(id);if(r){scene.remove(r.I.g);remotes.delete(id)}}
function connect(){
 ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host);
 ws.onopen=()=>{conn=true;lastP='';ws.send(JSON.stringify({t:'hello',name:myName,c:+HUE.toFixed(2)}))};
 ws.onclose=()=>{conn=false;[...remotes.keys()].forEach(dropRemote);online=1;$('on').textContent=1;setTimeout(connect,2000)};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
  if(m.t=='init'){myId=m.id;mySlot=m.slot;place(myI,mySlot);setName(myI,myName);m.players.forEach(addRemote)}
  else if(m.t=='join')addRemote(m);
  else if(m.t=='state'){const r=remotes.get(m.id);if(r)applyState(r,m.d)}
  else if(m.t=='leave')dropRemote(m.id);
  else if(m.t=='strike')onStrike(m);
  else if(m.t=='shield'){if(m.id===myId){S.shieldEnd=Date.now()+m.ms;toast('⚡ Щит включён на '+Math.round(m.ms/60000)+' мин')}else{const r=remotes.get(m.id);if(r)r.I.shieldUntil=Date.now()+m.ms}}
  else if(m.t=='deny')toast(m.msg);
  else if(m.t=='full')toast('Сервер полон (макс. 16 игроков)');
  online=remotes.size+1;$('on').textContent=online}}
connect();
setInterval(()=>{if(!ws||ws.readyState!==1||myId===null)return;const st={lv:{...S.lv},pvo:{...S.pvo},br:S.bridge?1:0,r:S.rockets.map(r=>r.lvl),x:+hum.position.x.toFixed(1),z:+hum.position.z.toFixed(1)};const j=JSON.stringify(st);if(j!==lastP){lastP=j;ws.send(JSON.stringify({t:'state',d:st}))}},120);

// ---- цикл ----
function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
let prev=performance.now(),acc=0;const camT=new THREE.Vector3();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-prev)/1000);prev=now;
 S.money+=income()*dt;$('m').textContent=fmt(S.money);$('inc').textContent=fmt(income());
 myI.apply({lv:S.lv,pvo:S.pvo,r:S.rockets.map(r=>r.lvl),br:S.bridge});myI.shieldUntil=S.shieldEnd;
 genRings.forEach((r,i)=>r.rotation.x=Math.PI/2+Math.sin(now/700+i*1.3)*.35);genOrb.scale.setScalar(1+.12*Math.sin(now/300));
 [myI,...[...remotes.values()].map(r=>r.I)].forEach(I=>{
  if(I.Z.f.visible)I.stables.forEach((s,i)=>{if(s.g.visible)s.horse.position.x=Math.sin(now/1500+i*1.7)*.8});
  if(I.Z.c.visible||I.Z.n.visible)I.smoke.forEach(q=>{const t=(now/3500+q.o)%1;q.m.position.y=q.y+t*5;q.m.scale.setScalar(.5+t*1.3);q.m.material.opacity=.55*(1-t)});
  K.forEach(k=>{const p=I.pvo[k];if(p.visible)p.userData.rot.rotation.y+=dt*1.3});const on=Date.now()<I.shieldUntil;I.dome.visible=on;if(on)I.dome.material.opacity=.14+.06*Math.sin(now/300)});
 coinG.rotation.y+=dt*1.5;bigCoin.position.y=8+Math.sin(now/600)*.5;
 let mx=0,mz=0;if(keys.KeyW||keys.ArrowUp)mz-=1;if(keys.KeyS||keys.ArrowDown)mz+=1;if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;
 let moving=false;const ph=myI.g.rotation.y,c=Math.cos(ph),s=Math.sin(ph);
 if(mx||mz){target=null;const l=Math.hypot(mx,mz);mx/=l;mz/=l;
  const wx=mx*Math.cos(ang)+mz*Math.sin(ang),wz=-mx*Math.sin(ang)+mz*Math.cos(ang);
  const dx=wx*c-wz*s,dz=wx*s+wz*c;const nx=hum.position.x+dx*7*dt,nz=hum.position.z+dz*7*dt;
  if(walkable(nx,nz)){hum.position.x=nx;hum.position.z=nz;moving=true}hum.rotation.y=Math.atan2(dx,dz)}
 else if(target){const dx=target.x-hum.position.x,dz=target.z-hum.position.z,d=Math.hypot(dx,dz);
  if(d<.2)target=null;else{const nx=hum.position.x+dx/d*7*dt,nz=hum.position.z+dz/d*7*dt;hum.rotation.y=Math.atan2(dx,dz);if(walkable(nx,nz)){hum.position.x=nx;hum.position.z=nz;moving=true}else target=null}}
 if(moving)wt+=dt*10;swing(me,moving?Math.sin(wt)*.7:0);
 remotes.forEach(r=>{const a=r.av.g,dx=r.tx-a.position.x,dz=r.tz-a.position.z,d=Math.hypot(dx,dz);
  if(d>.05){const st=Math.min(d,7*dt);a.position.x+=dx/d*st;a.position.z+=dz/d*st;a.rotation.y=Math.atan2(dx,dz);r.wt=(r.wt||0)+dt*10;swing(r.av,Math.sin(r.wt)*.7)}else swing(r.av,0)});
 S.rockets.forEach(r=>{
  if(r.state=='fly'){r.v+=dt*28;r.g.position.y+=r.v*dt;r.fl.scale.y=.8+Math.random()*.6;if(r.g.position.y>90){r.state='wait';r.t=5;r.g.visible=false;r.fl.visible=false;ui()}}
  else if(r.state=='wait'){r.t-=dt;if(r.t<=0){r.state='idle';r.g.position.y=.25;r.g.visible=true;ui()}}});
 for(let i=missiles.length-1;i>=0;i--){const m=missiles[i];m.t+=dt/3.5;const t=Math.min(1,m.t),t2=Math.min(1,t+.02);
  m.g.position.lerpVectors(m.a,m.b,t);m.g.position.y+=Math.sin(t*Math.PI)*60;
  const n=new THREE.Vector3().lerpVectors(m.a,m.b,t2);n.y+=Math.sin(t2*Math.PI)*60;m.g.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),n.sub(m.g.position).normalize());
  if(m.t>=(m.ic?.8:1)){scene.remove(m.g);missiles.splice(i,1);const L=LOC[m.loc];
   if(m.ic){boom(m.g.position.clone(),m.sh?0x7fffd4:0x4fc3f7);if(m.hit)toast(m.sh?'⚡ Энергетический щит заблокировал ракету':'🛡 ПВО сбила ракету: '+L.n);else if(m.mine)toast(m.sh?'⚡ Ракету заблокировал энергетический щит':'🛡 Твою ракету сбила ПВО')}
   else{boom(m.b);if(m.hit)hitMe(m.l,m.loc);else if(m.mine)toast('💥 Попадание: '+(m.name?m.name+', ':'')+L.n+'!')}}}
 for(let i=booms.length-1;i>=0;i--){const b=booms[i];b.t+=dt*1.2;b.m.scale.setScalar(1+b.t*10);b.m.material.opacity=Math.max(0,1-b.t);if(b.t>=1){scene.remove(b.m);booms.splice(i,1)}}
 hum.getWorldPosition(tmpV);nearGen=Math.hypot(tmpV.x,tmpV.z+22.4)<16;
 const D=ov?380:dist,P=ov?Math.max(pitch,.8):pitch;
 if(ov)camT.set(0,0,0);else hum.getWorldPosition(camT);
 cam.position.set(camT.x+Math.sin(ang)*Math.cos(P)*D,Math.sin(P)*D,camT.z+Math.cos(ang)*Math.cos(P)*D);cam.lookAt(camT.x,1,camT.z);
 sea.position.x=camT.x;sea.position.z=camT.z;
 acc+=dt;if(acc>.3){acc=0;ui()}
 renderer.render(scene,cam)}
ui();requestAnimationFrame(loop);
</script></body></html>
