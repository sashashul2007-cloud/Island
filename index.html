<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">

<style>

html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

.b:disabled{opacity:.45}
.row{display:flex;gap:6px}.row .b{flex:1}.row .b.sm{flex:0 0 38%;text-align:center}

#xh:before,#xh:after{content:"";position:absolute;background:#ff5252}#xh:before{left:21px;top:-10px;width:3px;height:66px}#xh:after{top:21px;left:-10px;height:3px;width:66px}

#tk{display:none;position:fixed;left:8px;right:58px;top:calc(env(safe-area-inset-top,0px) + 56px);background:var(--card);padding:5px 10px;border-radius:10px;font-size:12px;max-height:38px;overflow:hidden;pointer-events:none;z-index:4}

</style></head><body>
<div id="hud"><div class="pill"><small>Онлайн</small>👥 <span id="on">1</span></div><div class="pill"><small>Деньги</small>$<span id="m">10</span></div><div class="pill"><small>Доход</small>+$<span id="inc">0</span>/с</div></div><button id="ov">👁</button><div id="toast"></div><div id="alert"></div><div id="tk"></div>
<div id="mp"><div id="mpb"><span id="mpt"></span><button id="mpx">✖</button></div><iframe id="mpf" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const fmt=n=>{if(n<1e3)return Math.floor(n)+'';const u=['K','M','B','T','Q'];let i=-1;while(n>=1e3&&i<4){n/=1e3;i++}return n.toFixed(n<10?2:1)+u[i]};
// ---- локации ----
const K=['h','f','s','c','n'];
const LOC={h:{n:'Город',ico:'🏠',inc:15,up:13,buy:10,g:1.35},f:{n:'Ферма',ico:'🐴',inc:2500,up:6250,buy:1.3e5,g:1.33},
 s:{n:'Солнечные панели',ico:'☀️',inc:6e4,up:1.5e5,buy:2.2e7,g:1.37},c:{n:'Угольные печи',ico:'🏭',inc:1e6,up:2.5e6,buy:5.2e8,g:1.39},n:{n:'Атомные заводы',ico:'☢️',inc:1.6e7,up:4e7,buy:8.6e9,g:1.40}};
const PREV={h:null,f:'h',s:'f',c:'s',n:'c'};
const ZP={h:[-16,4],f:[-14,-16],s:[6,-20],c:[20,-6],n:[-6,20]},PP={h:[-16,11],f:[-7,-12],s:[6,-12],c:[15,-13],n:[3,14]};
const ZR={h:9,f:7.5,s:8,c:7,n:8},ZC={h:0x7fb069,f:0x9a7b4f,s:0x8d9299,c:0x555a60,n:0xb9bec4};
const S={set:'srv',mus:'news',turret:false,boat:false,bridge:false,shieldEnd:0,money:10,lv:{h:0,f:0,s:0,c:0,n:0},pvo:{h:0,f:0,s:0,c:0,n:0},rockets:[],tab:'l'};
const locInc=(k,l)=>l>0?LOC[k].inc*INCM*Math.pow(1.15,l-1):0;
const upCost=(k,l)=>Math.round(LOC[k].up*Math.pow(LOC[k].g,l-1));
const PM={h:1,f:4,s:16,c:64,n:256};
const pvoUp=(k,l)=>Math.round(PM[k]*Math.pow(2+l/10,4)),rockUp=l=>Math.round(60*Math.pow(2+l/10,4)),rockBuy=n=>[1000,1e4,1e5,1e6][n];
const launchBonus=l=>Math.max(5*l,Math.round(income()*(.2+l*.0016)));
const NS=16,RING=290,HUE=Math.random();
const BOAT_COST=5e6,BOAT_SPEED=22,TURRET_COST=2e7,SHOT_V=110,SHOT_G=-25,TUR_POS=[11,24],TUR_H=9;
const INCM=1,BR_FROM=30,BR_TO=RING-18,BRIDGE_COST=3e11,SHIELD_COST=1e11,SHIELD_MS=300000;
const allyBonus=()=>myAl?Math.min(.1,.02*[...remotes.values()].filter(r=>r.al===myAl).length):0;
const income=()=>K.reduce((a,k)=>a+locInc(k,S.lv[k]),0)*(1+allyBonus());

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ad4f5);scene.fog=new THREE.Fog(0x9ad4f5,250,1000);
const cam=new THREE.PerspectiveCamera(55,1,.1,3000);
scene.add(new THREE.HemisphereLight(0xffffff,0x6a8f5a,.9));
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(20,30,10);scene.add(sun);
const MC={};const M=c=>MC[c]||(MC[c]=new THREE.MeshLambertMaterial({color:c}));
const mesh=(g,c,x=0,y=0,z=0)=>{const m=new THREE.Mesh(g,typeof c=='number'?M(c):c);m.position.set(x,y,z);return m};
const sea=mesh(new THREE.PlaneGeometry(4000,4000),0x2a8fd6);sea.rotation.x=-Math.PI/2;sea.position.y=-1.2;scene.add(sea);
function isle(r){const g=new THREE.Group();g.add(mesh(new THREE.BoxGeometry(2*r+3,2,2*r+3),0xe8d08a,0,-.9,0));g.add(mesh(new THREE.BoxGeometry(2*r,.35,2*r),0xa8e68c,0,-.05,0));return g}
function label(txt){const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,0,256,64);x.fillStyle='#fff';const tt2=txt.slice(0,28);let fs=30;x.font='bold 30px sans-serif';while(x.measureText(tt2).width>240&&fs>13){fs--;x.font='bold '+fs+'px sans-serif'}x.textAlign='center';x.fillText(tt2,128,43);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));s.scale.set(14,3.5,1);s.position.y=17;return s}
function setName(I,n){if(I.lab)I.g.remove(I.lab);I.lab=label(n);I.g.add(I.lab)}

// ---- большой остров игрока ----
const slots=[[15,10],[21,10],[15,14],[21,14]];
const bx=(w,h,d)=>new THREE.BoxGeometry(w,h,d),cyl=(a,b,h,n=12)=>new THREE.CylinderGeometry(a,b,h,n);
const dbl=c=>new THREE.MeshLambertMaterial({color:c,side:THREE.DoubleSide});
function skin(r){r.g.scale.setScalar(.8+r.lvl/500*1.4);r.body.material.color.setHSL(r.lvl/500*.85,r.lvl>1?.7:0,r.lvl>1?.65:1);r.b2.visible=r.lvl>=100;r.b4.visible=r.lvl>=250;r.nose.material.color.setHex(r.lvl>=400?0xffc400:0xd32f2f)}
function mkRocketMesh(){const rg=new THREE.Group();
 const body=mesh(cyl(.45,.5,2.4,20),new THREE.MeshLambertMaterial({color:0xffffff}),0,1.4,0);rg.add(body);
 rg.add(mesh(cyl(.52,.52,.25,20),0x37474f,0,.75,0));rg.add(mesh(cyl(.5,.5,.12,20),0xd32f2f,0,2.1,0));
 const nose=mesh(new THREE.ConeGeometry(.45,1,20),new THREE.MeshLambertMaterial({color:0xd32f2f}),0,3.1,0);rg.add(nose);
 const win=mesh(new THREE.SphereGeometry(.17,12,10),0x4fc3f7,0,1.7,.42);win.scale.z=.5;rg.add(win);rg.add(mesh(new THREE.TorusGeometry(.19,.04,6,14),0x37474f,0,1.7,.43));
 for(let k=0;k<4;k++){const f=new THREE.Group();f.rotation.y=k*Math.PI/2;f.add(mesh(bx(.7,.9,.08),0x1565c0,.6,.65,0));rg.add(f)}
 rg.add(mesh(cyl(.25,.4,.4),0x263238,0,.2,0));
 const boost=(x,z)=>{const b=new THREE.Group();b.position.set(x,0,z);b.add(mesh(cyl(.18,.2,1.6,12),0xeceff1,0,1,0));b.add(mesh(new THREE.ConeGeometry(.18,.5,12),0xd32f2f,0,2.05,0));b.add(mesh(cyl(.1,.2,.25,10),0x263238,0,.15,0));return b};
 const b2=new THREE.Group();b2.add(boost(.75,0),boost(-.75,0));const b4=new THREE.Group();b4.add(boost(0,.75),boost(0,-.75));b2.visible=b4.visible=false;rg.add(b2,b4);
 for(let k=0;k<3;k++){const a=k*Math.PI*2/3+.5,l=mesh(cyl(.04,.05,.9,6),0x78909c,Math.cos(a)*.7,.0,Math.sin(a)*.7);l.rotation.z=Math.cos(a)*.4;l.rotation.x=-Math.sin(a)*.4;rg.add(l)}
 const fl=new THREE.Group();const f1=mesh(new THREE.ConeGeometry(.32,1.5,10),new THREE.MeshBasicMaterial({color:0xff9800}),0,-.55,0);f1.rotation.x=Math.PI;const f2=mesh(new THREE.ConeGeometry(.18,1,10),new THREE.MeshBasicMaterial({color:0xffee58}),0,-.35,0);f2.rotation.x=Math.PI;fl.add(f1,f2);fl.visible=false;rg.add(fl);
 return {g:rg,body,nose,b2,b4,fl}}
function mkTree(s=1){const t=new THREE.Group();t.add(mesh(cyl(.2,.28,1.4,6),0x6b4423,0,.7,0));t.add(mesh(new THREE.ConeGeometry(1.2,1.9,8),0x2e8b3a,0,2,0));t.add(mesh(new THREE.ConeGeometry(.9,1.5,8),0x3aa04a,0,3,0));t.scale.setScalar(s);return t}
function mkHouse(i){const h=new THREE.Group(),wall=[0xf4e3c1,0xe9c6c6,0xc6d9e9,0xdbe9c6,0xf0d9a8][i%5],rc=[0xa8452f,0x6d4c41,0x37618f,0x7a3b3b,0x4e6b3a][i%5];
 h.add(mesh(bx(1.9,.15,1.9),0x9e9e9e,0,.07,0));h.add(mesh(bx(1.8,1.3,1.8),wall,0,.8,0));
 const r=mesh(new THREE.ConeGeometry(1.5,1,4),rc,0,1.95,0);r.rotation.y=Math.PI/4;h.add(r);h.add(mesh(bx(.25,.6,.25),0x8d6e63,.5,2.1,.3));
 h.add(mesh(bx(.42,.8,.06),0x5d3a1a,0,.55,.92));h.add(mesh(new THREE.SphereGeometry(.04,6,6),0xffd54f,.14,.55,.97));h.add(mesh(bx(.9,.07,.5),0xbcaaa4,0,.04,1.2));
 [-.58,.58].forEach(x=>{h.add(mesh(bx(.46,.46,.04),0xffffff,x,1,.91));h.add(mesh(bx(.36,.36,.06),0x81d4fa,x,1,.92))});
 [-.91,.91].forEach(x=>{h.add(mesh(bx(.04,.46,.46),0xffffff,x,1,0));h.add(mesh(bx(.06,.36,.36),0x81d4fa,x,1,0))});return h}
function mkHorse(c){const h=new THREE.Group(),m=M(c);
 h.add(mesh(bx(1.5,.7,.55),m,0,1.05,0));const neck=mesh(bx(.35,.8,.3),m,.75,1.5,0);neck.rotation.z=-.4;h.add(neck);h.add(mesh(bx(.6,.3,.3),m,1.15,1.85,0));
 h.add(mesh(bx(.5,.08,.06),0x3e2723,.55,1.85,0));h.add(mesh(bx(.1,.5,.08),0x3e2723,-.78,1.15,0));
 [[-.55,-.2],[-.55,.2],[.55,-.2],[.55,.2]].forEach(p=>h.add(mesh(bx(.14,.75,.14),0x5d3a1a,p[0],.38,p[1])));return h}
function mkBarn(){const b=new THREE.Group();b.add(mesh(bx(3.2,2,2.6),0xb3392f,0,1,0));
 const roof=mesh(cyl(2.2,2.2,3.5,3),0x5d3a1a,0,2.6,0);roof.rotation.z=Math.PI/2;roof.rotation.y=Math.PI/2;b.add(roof);
 b.add(mesh(bx(1.1,1.4,.08),0xf2e6c9,0,.7,1.32));[.7,-.7].forEach(a=>{const x=mesh(bx(1.3,.08,.06),0xffffff,0,.7,1.37);x.rotation.z=a;b.add(x)});
 b.add(mesh(bx(.5,.5,.06),0xf2e6c9,0,2.25,1.32));[-1.6,1.6].forEach(x=>b.add(mesh(bx(.1,2,.1),0xffffff,x,1,1.3)));return b}
function mkPanel(){const p=new THREE.Group();p.add(mesh(cyl(.08,.1,1,6),0x666666,0,.5,0));
 const t=new THREE.Group();t.position.y=1.05;t.rotation.x=-.5;t.add(mesh(bx(2.5,.08,1.7),0xcfd8dc),mesh(bx(2.3,.1,1.5),0x1a2f7a,0,.01,0),mesh(bx(2.3,.11,.04),0x7986cb,0,.01,0),mesh(bx(.04,.11,1.5),0x7986cb,-.38,.01,0),mesh(bx(.04,.11,1.5),0x7986cb,.38,.01,0));p.add(t);return p}
const smokeMat=c=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.5,depthWrite:false});
function mkFurn(sm){const f=new THREE.Group();f.add(mesh(bx(3,.3,3),0x424242,0,.15,0));f.add(mesh(bx(2.8,2.2,2.8),0x7b3f2a,0,1.4,0));f.add(mesh(bx(3,.25,3),0x37474f,0,2.6,0));
 f.add(mesh(cyl(.45,.6,4.5),0x555a60,.7,4.8,.7));f.add(mesh(cyl(.5,.5,.4),0xd32f2f,.7,6.5,.7));f.add(mesh(bx(1.2,.9,.08),new THREE.MeshBasicMaterial({color:0xff8f00}),0,1,1.43));f.add(mesh(bx(1.4,1.1,.06),0x212121,0,1,1.41));
 for(let k=0;k<3;k++){const m=mesh(new THREE.SphereGeometry(.6,8,8),smokeMat(0x9e9e9e),.7,7,.7);f.add(m);sm.push({m,o:k/3,y:7})}return f}
function mkTower(sm){const t=new THREE.Group();const pts=[[2.9,0],[2.4,1.5],[1.9,3.5],[1.7,5],[1.9,6.5],[2.3,8]].map(p=>new THREE.Vector2(p[0],p[1]));
 t.add(mesh(new THREE.LatheGeometry(pts,24),dbl(0xcfd3d6),0,0,0));t.add(mesh(cyl(2.35,2.35,.3,24),0xd32f2f,0,7.85,0));
 const rc=new THREE.Group();rc.position.z=5.2;rc.add(mesh(cyl(1.8,1.9,2.4,18),0xb0bec5,0,1.2,0));rc.add(mesh(new THREE.SphereGeometry(1.8,16,8,0,Math.PI*2,0,Math.PI/2),0x90a4ae,0,2.4,0));rc.add(mesh(bx(.8,.8,.05),0xffd600,0,1.3,1.88));t.add(rc);
 for(let k=0;k<3;k++){const m=mesh(new THREE.SphereGeometry(1.2,10,8),smokeMat(0xffffff),0,8.5,0);t.add(m);sm.push({m,o:k/3,y:8.5})}return t}
function mkPvo(){const t=new THREE.Group();t.add(mesh(cyl(1.3,1.5,.5,14),0x6b7077,0,.25,0));
 const rot=new THREE.Group();rot.position.y=.5;rot.add(mesh(bx(1.3,.7,1.3),0x4d5560,0,.35,0));
 [-.55,.55].forEach(x=>{[-.3,.3].forEach(z=>{const tb=mesh(cyl(.15,.15,2,8),0x2e7d32,x,1.2,z);tb.rotation.z=x>0?-.55:.55;rot.add(tb);const tip=mesh(new THREE.ConeGeometry(.15,.35,8),0x333333,x+(x>0?.55:-.55)*.95,2.15,z);tip.rotation.z=x>0?-.55:.55;rot.add(tip)})});
 rot.add(mesh(cyl(.07,.07,.9,6),0x888888,0,1.1,0));const d=mesh(new THREE.SphereGeometry(.6,12,8,0,Math.PI*2,0,Math.PI/2),dbl(0xe0e0e0),0,1.6,.1);d.rotation.x=-1.1;rot.add(d);
 rot.add(mesh(new THREE.SphereGeometry(.12,8,8),0xff1744,0,.78,.5));t.add(rot);t.userData.rot=rot;return t}
function makeIsland(){
 const g=new THREE.Group();scene.add(g);const I={g,houses:[],rockets:[],panels:[],furn:[],towers:[],stables:[],smoke:[],pvo:{},slot:null};
 g.add(isle(31));g.add(mesh(bx(14,.2,14),0x888c94,18,.15,12));[[11.3,5.3],[24.7,5.3],[11.3,18.7],[24.7,18.7]].forEach(p=>g.add(mesh(bx(.9,.22,.9),0xffd600,p[0],.16,p[1])));
 [[28,22,1.1],[28,-18,1],[-28,-28,1.2],[26,-26,1],[-28,14,1],[-28,24,1.1],[28,-5,.9],[-3,-27,1]].forEach(p=>{const t=mkTree(p[2]);t.position.set(p[0],0,p[1]);g.add(t)});
 const Z={};K.forEach(k=>{const z=new THREE.Group();z.position.set(ZP[k][0],0,ZP[k][1]);z.visible=false;z.add(mesh(bx(2*ZR[k]+.8,.1,2*ZR[k]+.8),0x8e9a86,0,.06,0));z.add(mesh(bx(2*ZR[k],.12,2*ZR[k]),ZC[k],0,.1,0));g.add(z);Z[k]=z});I.Z=Z;
 Z.h.add(mesh(bx(15,.05,1.4),0x616161,0,.16,0));for(let i=-3;i<=3;i++)Z.h.add(mesh(bx(1,.06,.12),0xffffff,i*2,.17,0));
